<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355f56"><title>旅册</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="eyebrow">TRAVEL PLANNER</span><h1>旅册</h1><p id="subtitle">一程一册，行装皆有序。</p></div><div><button id="logout">退出</button> <button class="primary" id="newTrip">＋ 新建旅行</button></div></header>
<main><aside><div class="aside-title"><b>旅行计划</b><button id="duplicate" title="复制当前计划">复制</button></div><nav id="tripList"></nav><div class="storage-note">云端家庭共享 · <span id="syncStatus">正在读取…</span></div></aside>
<section class="workspace"><div class="toolbar"><div><input id="tripName" aria-label="旅行名称"><input id="tripMeta" aria-label="日期地点" placeholder="日期 · 地点"></div><div class="progress"><span id="progressText"></span><div><i id="progressBar"></i></div></div><div class="actions"><button id="editToggle">编辑</button><button onclick="window.print()">打印</button><button class="danger" id="reset">清空勾选</button></div></div><div class="tabs" id="tabs"><button data-tab="itinerary">行程</button><button data-tab="bookings">预订与联系人</button><button data-tab="packing">装箱清单</button></div><div id="tabContent"></div></section></main>
<dialog id="tripDialog"><form method="dialog"><h2>新建旅行</h2><label>旅行名称<input id="newName" required placeholder="例如：山海行"></label><label>日期与地点<input id="newMeta" placeholder="2026.10 · 厦门"></label><menu><button value="cancel">取消</button><button value="default" id="createTrip" class="primary">创建</button></menu></form></dialog>
<template id="categoryTpl"><article class="card"><div class="card-head"><input class="category-name"><span class="category-icon">✦</span><button class="remove-category edit-only">×</button></div><div class="column-head"><span>物品</span><span>数量</span><span>已打包</span></div><div class="items"></div><button class="add-item edit-only">＋ 添加物品</button></article></template>
<script src="app.js"></script></body></html>
