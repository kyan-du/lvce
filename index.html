<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355f56"><title>旅册</title><link rel="icon" href="/favicon.ico?v=4e7ee0e9" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32-4e7ee0e9.png"><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon-180-4e7ee0e9.png"><link rel="manifest" href="/site.webmanifest?v=4e7ee0e9"><link rel="stylesheet" href="/style.css?v=20260804-1015"></head><body data-tab="itinerary">
<header><div class="brand"><div class="brand-line"><img class="brand-logo" src="/assets/lvce-logo-4e7ee0e9.png" width="512" height="512" alt="LVCE logo"><div class="brand-copy"><h1>旅册</h1><p id="subtitle">一程一册，行装皆有序</p></div></div></div><button id="logout" class="manage-only" aria-label="退出账户"><svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6.8A1.8 1.8 0 0 0 5 6.8v10.4A1.8 1.8 0 0 0 6.8 19H10M14.5 8.5 18 12l-3.5 3.5M9 12h9"/></svg><span>退出</span></button></header>
<main><aside><div class="aside-title manage-only"><b>旅行计划</b><button id="newTrip" aria-label="新建"><svg class="new-trip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="new-trip-label">新建</span></button></div><div class="trip-switcher"><nav id="tripList"></nav><div class="trip-actions manage-only"><button id="cancelEdit" class="edit-session-action">取消</button><button id="saveEdit" class="primary edit-session-action">保存</button><details class="menu toolbar-menu"><summary aria-label="更多操作">•••</summary><div class="menu-panel"><button id="editTrip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg><span>修改</span></button><button id="duplicate"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>复制</span></button><button id="shareTrip"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg><span>分享</span></button><div class="menu-separator"></div><button class="danger" id="deleteTrip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg><span>删除</span></button></div></details></div></div><div class="account-bar manage-only"><span>云端家庭共享 · <span id="syncStatus">正在读取…</span></span></div></aside>
<section class="workspace"><div class="toolbar desktop-toolbar"><div class="trip-heading"><input id="tripName" aria-label="旅行名称"><input id="tripMeta" aria-label="日期地点" placeholder="日期 · 地点"></div></div><div class="tabs" id="tabs"><button data-tab="itinerary">行程</button><button data-tab="bookings"><span class="desktop-label">预订与联系人</span><span class="mobile-label">预订</span></button><button data-tab="packing"><span class="desktop-label">装箱清单</span><span class="mobile-label">装箱</span></button><button data-tab="reading">旅读</button></div><div class="module-bar"><strong id="moduleTitle">每日行程</strong></div><div class="progress"><span id="progressText"></span><div><i id="progressBar"></i></div></div><div id="tabContent"></div></section></main>
<dialog id="tripDialog"><form method="dialog" autocomplete="off"><h2>新建旅行</h2><label>旅行名称<input id="newName" name="trip-title" type="text" required autocomplete="off" autocorrect="off" spellcheck="false" placeholder="例如：山海行"></label><div class="dialog-grid"><label>日期<input id="newMonth" name="trip-month" type="month" autocomplete="off"></label><label>地点<input id="newPlace" name="trip-place" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="例如：厦门"></label></div><menu><button type="button" id="cancelTrip" formnovalidate>取消</button><button value="default" id="createTrip" class="primary">创建</button></menu></form></dialog>
<dialog id="deleteDialog"><form method="dialog"><h2>删除旅行？</h2><p>将永久删除「<strong id="deleteTripName"></strong>」，并同步到云端。此操作无法撤销。</p><p class="dialog-warning">删除后无法恢复，请确认不再需要这份旅行。</p><menu><button value="cancel">取消</button><button value="confirm" id="confirmDeleteTrip" class="danger-solid">永久删除</button></menu></form></dialog>
<dialog id="shareFallbackDialog"><form method="dialog"><h2>复制分享链接</h2><p>浏览器没有开放剪贴板权限，请手动复制下面的公开链接。</p><input id="shareFallbackUrl" readonly aria-label="公开分享链接"><menu><button id="closeShareFallback" value="default" class="primary">完成</button></menu></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<template id="categoryTpl"><article class="card"><div class="card-head"><input class="category-name"><span class="category-icon">✦</span><button class="remove-category edit-only">×</button></div><div class="column-head"><span>物品</span><span>数量</span><span>已打包</span></div><div class="items"></div><button class="add-item edit-only">＋ 添加物品</button></article></template>
<script src="/app.js?v=20260804-1015"></script></body></html>
