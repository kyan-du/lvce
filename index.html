<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355f56"><title>旅册</title><link rel="stylesheet" href="style.css"></head><body data-tab="itinerary">
<header><div><span class="eyebrow">TRAVEL PLANNER</span><div class="brand-line"><h1>旅册</h1><p id="subtitle">一程一册，行装皆有序</p></div></div><button id="logout" aria-label="退出账户"><svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5H6.8A1.8 1.8 0 0 0 5 6.8v10.4A1.8 1.8 0 0 0 6.8 19H10M14.5 8.5 18 12l-3.5 3.5M9 12h9"/></svg><span>退出</span></button></header>
<main><aside><div class="aside-title"><b>旅行计划</b><button id="newTrip" class="primary">新建旅行</button></div><div class="trip-switcher"><nav id="tripList"></nav><div class="trip-actions"><details class="menu toolbar-menu"><summary aria-label="更多操作">•••</summary><div class="menu-panel"><button id="duplicate">复制当前旅行</button><button id="printTrip">打印</button><div class="menu-separator"></div><button class="danger" id="deleteTrip">删除旅行</button></div></details></div></div><div class="account-bar"><span>云端家庭共享 · <span id="syncStatus">正在读取…</span></span></div></aside>
<section class="workspace"><div class="toolbar desktop-toolbar"><div class="trip-heading"><input id="tripName" aria-label="旅行名称"><input id="tripMeta" aria-label="日期地点" placeholder="日期 · 地点"></div></div><div class="tabs" id="tabs"><button data-tab="itinerary">行程</button><button data-tab="bookings"><span class="desktop-label">预订与联系人</span><span class="mobile-label">预订</span></button><button data-tab="packing"><span class="desktop-label">装箱清单</span><span class="mobile-label">装箱</span></button></div><div class="module-bar"><strong id="moduleTitle">每日行程</strong><button id="editToggle">编辑</button></div><div class="progress"><span id="progressText"></span><div><i id="progressBar"></i></div></div><div id="tabContent"></div></section></main>
<dialog id="tripDialog"><form method="dialog"><h2>新建旅行</h2><label>旅行名称<input id="newName" required placeholder="例如：山海行"></label><label>日期与地点<input id="newMeta" placeholder="2026.10 · 厦门"></label><menu><button value="cancel">取消</button><button value="default" id="createTrip" class="primary">创建</button></menu></form></dialog>
<dialog id="deleteDialog"><form method="dialog"><h2>删除旅行？</h2><p>将永久删除「<strong id="deleteTripName"></strong>」，并同步到云端。此操作无法撤销。</p><p class="dialog-warning">删除后无法恢复，请确认不再需要这份旅行。</p><menu><button value="cancel">取消</button><button value="confirm" id="confirmDeleteTrip" class="danger-solid">永久删除</button></menu></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<template id="categoryTpl"><article class="card"><div class="card-head"><input class="category-name"><span class="category-icon">✦</span><button class="remove-category edit-only">×</button></div><div class="column-head"><span>物品</span><span>数量</span><span>已打包</span></div><div class="items"></div><button class="add-item edit-only">＋ 添加物品</button></article></template>
<script src="app.js"></script></body></html>
