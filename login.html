<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#355f56"><title>登录 · 旅册</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f1e9}.login{width:min(88vw,380px);background:white;padding:32px;border-radius:16px;box-shadow:0 12px 40px #355f5620}.login h1{margin:0 0 6px}.login label,.login input,.login button{display:block;width:100%;box-sizing:border-box}.login input{margin:18px 0 12px;padding:12px}.error{color:#9b392d;min-height:1.5em}</style></head><body><form class="login" id="login" autocomplete="on"><span class="eyebrow">FAMILY TRAVEL PLANNER</span><h1>旅册</h1><label for="password">请输入密码</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><p class="error" id="error"></p><button class="primary" type="submit">登录</button></form><script>login.onsubmit=async e=>{e.preventDefault();error.textContent='';const button=e.currentTarget.querySelector('button');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:password.value})});if(!r.ok){const x=await r.json();throw Error(x.error||'登录失败')}location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false}}</script></body></html>
